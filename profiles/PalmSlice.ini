# PalmSlice vendor bundle: printers PrusaSlicer's own vendor profiles don't have.
# Generated by scripts/profiles/make_palmslice_bundle.py; edit that, not this file.
# Snapmaker U1 presets are ported from OrcaSlicer's Snapmaker profiles (AGPL-3.0).

[vendor]
name = PalmSlice
config_version = 1.0.0
config_update_url =

[printer_model:Snapmaker U1]
name = Snapmaker U1
variants = 0.4
technology = FFF
family = Snapmaker
default_materials = Generic PLA @Snapmaker U1;Generic PETG @Snapmaker U1;Generic TPU @Snapmaker U1

[printer:Snapmaker U1 (0.4 nozzle)]
printer_technology = FFF
printer_model = Snapmaker U1
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_SNAPMAKER\nPRINTER_MODEL_U1\nPALMSLICE_UNTESTED
default_print_profile = 0.20 Standard @Snapmaker U1 (0.4 nozzle)
default_filament_profile = "Generic PLA @Snapmaker U1";"Generic PLA @Snapmaker U1";"Generic PLA @Snapmaker U1";"Generic PLA @Snapmaker U1"
bed_shape = 0.5x1,270.5x1,270.5x271,0.5x271
max_print_height = 270
gcode_flavor = klipper
use_relative_e_distances = 1
use_firmware_retraction = 0
single_extruder_multi_material = 0
nozzle_diameter = 0.4,0.4,0.4,0.4
extruder_offset = 0x0,0x0,0x0,0x0
min_layer_height = 0.08,0.08,0.08,0.08
max_layer_height = 0.32,0.32,0.32,0.32
retract_length = 1.5,1.5,1.5,1.5
retract_speed = 30,30,30,30
deretract_speed = 30,30,30,30
retract_length_toolchange = 10,10,10,10
retract_restart_extra = 0,0,0,0
retract_restart_extra_toolchange = 0,0,0,0
retract_lift = 0.4,0.4,0.4,0.4
retract_lift_above = 0,0,0,0
retract_lift_below = 269,269,269,269
retract_before_travel = 1,1,1,1
retract_layer_change = 1,1,1,1
retract_before_wipe = 0%,0%,0%,0%
wipe = 1,1,1,1
extruder_clearance_radius = 72.5
extruder_clearance_height = 27.5
machine_limits_usage = time_estimate_only
machine_max_feedrate_x = 500,200
machine_max_feedrate_y = 500,200
machine_max_feedrate_z = 20,12
machine_max_feedrate_e = 30,25
machine_max_acceleration_x = 20000,20000
machine_max_acceleration_y = 20000,20000
machine_max_acceleration_z = 500,200
machine_max_acceleration_e = 5000,5000
machine_max_acceleration_extruding = 20000,20000
machine_max_acceleration_retracting = 5000,5000
machine_max_acceleration_travel = 20000,20000
machine_max_jerk_x = 9,9
machine_max_jerk_y = 9,9
machine_max_jerk_z = 3,0.4
machine_max_jerk_e = 2.5,2.5
remaining_times = 1
binary_gcode = 0
thumbnails = 48x48/PNG, 300x300/PNG
multimaterial_purging = 45
pause_print_gcode = M600
start_gcode = ; Snapmaker U1 start, PalmSlice port of OrcaSlicer's profile (2026-01-28)\nSET_PRINT_AUTO_BED_LEVELING ENABLE=1\nSET_TIME_LAPSE_CAMERA ENABLE=1\nPRINT_START\nDEFECT_DETECTION_START\nSET_PRINT_STATS_INFO TOTAL_LAYER={total_layer_count} CURRENT_LAYER=0\nTIMELAPSE_START\nM140 S{first_layer_bed_temperature[initial_extruder]}\nM104 T{initial_extruder} S140\nM204 S10000\n;===== top cover purifier =====\n{if (is_extruder_used[0] and one_of(filament_type[0], "PLA", "PLA-CF", "TPU", "FLEX", "PVA")) or (is_extruder_used[1] and one_of(filament_type[1], "PLA", "PLA-CF", "TPU", "FLEX", "PVA")) or (is_extruder_used[2] and one_of(filament_type[2], "PLA", "PLA-CF", "TPU", "FLEX", "PVA")) or (is_extruder_used[3] and one_of(filament_type[3], "PLA", "PLA-CF", "TPU", "FLEX", "PVA"))}\nSET_PURIFIER_MODE MODE=1 DESIRE_TEMP=42 ALARM_TEMP=48 FAN_SPEED=0.6 DELAY_OFF=0 ; strong cooling\n{elsif (is_extruder_used[0] and one_of(filament_type[0], "PETG", "PET", "PCTG", "HIPS")) or (is_extruder_used[1] and one_of(filament_type[1], "PETG", "PET", "PCTG", "HIPS")) or (is_extruder_used[2] and one_of(filament_type[2], "PETG", "PET", "PCTG", "HIPS")) or (is_extruder_used[3] and one_of(filament_type[3], "PETG", "PET", "PCTG", "HIPS"))}\nSET_PURIFIER_MODE MODE=1 DESIRE_TEMP=45 ALARM_TEMP=51 FAN_SPEED=0.6 DELAY_OFF=0 ; weak cooling\n{else}\nSET_PURIFIER_MODE MODE=3 DESIRE_TEMP=45 FAN_SPEED=0.6 DELAY_OFF=600 ; keep warm\n{endif}\nG28 X Y\nDEFECT_DETECT_NOODLE_FIRST\n;===== bed foreign object detection =====\nT{initial_extruder}\nG90\nDEFECT_DETECTION_DETECT_BED\n;===== toolhead pick-up check =====\nSM_PRINT_CHECK_SWITCH_EXTRUDER\n\n;===== auto feed, flow calibration (used tools only) =====\n{if is_extruder_used[1]}SM_PRINT_EXTRUDER_PREHEAT EXTRUDER=1 TEMP=140\n{endif}{if is_extruder_used[0]}SM_PRINT_AUTO_FEED EXTRUDER=0\nSM_PRINT_FLOW_CALIBRATE EXTRUDER=0\n{endif}{if is_extruder_used[2]}SM_PRINT_EXTRUDER_PREHEAT EXTRUDER=2 TEMP=140\n{endif}{if is_extruder_used[1]}SM_PRINT_AUTO_FEED EXTRUDER=1\nSM_PRINT_FLOW_CALIBRATE EXTRUDER=1\n{endif}{if is_extruder_used[3]}SM_PRINT_EXTRUDER_PREHEAT EXTRUDER=3 TEMP=140\n{endif}{if is_extruder_used[2]}SM_PRINT_AUTO_FEED EXTRUDER=2\nSM_PRINT_FLOW_CALIBRATE EXTRUDER=2\n{endif}{if is_extruder_used[3]}SM_PRINT_AUTO_FEED EXTRUDER=3\nSM_PRINT_FLOW_CALIBRATE EXTRUDER=3\n{endif}M104 S0 T0 A0\nM104 S0 T1 A0\nM104 S0 T2 A0\nM104 S0 T3 A0\n\n;===== pre-extrude =====\nM104 T{initial_extruder} S{temperature[initial_extruder]}\nT{initial_extruder}\nM109 T{initial_extruder} S{temperature[initial_extruder]}\nSM_PRINT_PREEXTRUDE_FILAMENT INDEX={initial_extruder}\nM104 T{initial_extruder} S{temperature[initial_extruder] - 90}\n\n;===== rough homing =====\nT{initial_extruder}\nM106 S255\nM106 P2 S0\nMOVE_TO_DISCARD_FILAMENT_POSITION\nM109 T{initial_extruder} S{temperature[initial_extruder] - 90}\nROUGHLY_CLEAN_NOZZLE_WITH_DISCARD\nMOVE_TO_XY_IDLE_POSITION_EXTRUDER\nM107\nG28 Z I140 J140\n\n;===== plate detection =====\nM107\nDETECT_BED_PLATE\n\n;===== deep nozzle clean =====\nM106 S255\nG90\nG0 Z5 F10000\nMOVE_TO_DISCARD_FILAMENT_POSITION\nM109 S{temperature[initial_extruder] - 50}\nROUGHLY_CLEAN_NOZZLE\nMOVE_TO_XY_IDLE_POSITION_EXTRUDER\nFINELY_CLEAN_NOZZLE_STAGE_1\nM104 S{temperature[initial_extruder] - 90}\nG0 Z5 F10000\nMOVE_TO_DISCARD_FILAMENT_POSITION\nROUGHLY_CLEAN_NOZZLE\nMOVE_TO_XY_IDLE_POSITION_EXTRUDER\nFINELY_CLEAN_NOZZLE_STAGE_2\n\n;===== fine homing =====\nM106 S255\nM109 S{temperature[initial_extruder] - 90}\nM190 S{first_layer_bed_temperature[initial_extruder]}\nM107 P2\nG90\nG0 Z5 F10000\nWAIT_CHAMBER_TEMP TIMEOUT=180\nM107\nG28 Z\n\n;===== bed mesh over the first layer =====\nM107\n; ADAPTIVE=0: the mesh area comes from the slicer (first layer bounds, clamped to the probe area)\nBED_MESH_CALIBRATE mesh_min={max(3, first_layer_print_min[0])},{max(3, first_layer_print_min[1])} mesh_max={min(267, first_layer_print_max[0])},{min(267, first_layer_print_max[1])} ADAPTIVE=0 ADAPTIVE_MARGIN=0\n\n;===== prime line =====\nG90\nG1 Z1.5\nG0 X85 Y1 Z2 F18000\nM109 S{first_layer_temperature[initial_extruder]}\nG1 Z0.2\nM83\nG1 X185 E15 F360\nG1 Z1.5\n\nG90\nM106 S0
end_gcode = ; Snapmaker U1 end, PalmSlice port of OrcaSlicer's profile (2026-06-05)\nPRINT_END\nTIMELAPSE_STOP\n\n; U1 nozzle flow metadata, in logical filament order\n; filament_volume_type = standard{if size(filament_type) > 1},standard{endif}{if size(filament_type) > 2},standard{endif}{if size(filament_type) > 3},standard{endif}
toolchange_gcode = ; Snapmaker U1 tool change, PalmSlice port of OrcaSlicer's profile (2026-06-07)\n; Change Tool[previous_extruder] -> Tool[next_extruder] (layer [layer_num])\nG91\nG1 Z1.5 F600\nG90\nG1 F{min(travel_speed, 350) * 60}\n{if not (layer_num < 0 and next_extruder == initial_tool)}M109 S{if layer_num == 0}{first_layer_temperature[next_extruder]}{else}{temperature[next_extruder]}{endif} T{next_extruder}\n{endif}M400\nT{next_extruder}\n{if filament_type[next_extruder] == "PVA"}SET_VELOCITY_LIMIT ACCEL=3000\n{endif}{if previous_extruder != next_extruder and initial_extruder != next_extruder}SM_PRINT_PREEXTRUDE_FILAMENT INDEX={next_extruder}\n{endif}G90\n; back down to the layer (PrusaSlicer doesn't track the lift above)\nG1 Z{toolchange_z + z_offset} F600
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\nG92 E0\nTIMELAPSE_TAKE_FRAME\nDEFECT_DETECTION_DETECT
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]\nSET_PRINT_STATS_INFO TOTAL_LAYER={total_layer_count} CURRENT_LAYER={layer_num+1}

