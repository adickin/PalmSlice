# xcodegen project spec for PalmSlice
# Generate with: cd app && xcodegen
# Then open:     open PalmSlice.xcodeproj
#
# Prerequisites:
#   • Run build.sh (or at least up through 11_xcframework.sh) so that
#     libslic3r.xcframework exists at app/libslic3r.xcframework
#   • All deps installed in ~/ios-sysroot-sim (OrcaSlicer's under ~/ios-sysroot-sim/orca)
#   • OrcaSlicer profiles copied to PalmSlice/OrcaResources (scripts/15_orca_profiles.sh)
#   • Copy app/project.local.yml.example to app/project.local.yml and fill in your team ID

include:
  - path: project.local.yml
    optional: true

name: PalmSlice
options:
  bundleIdPrefix: com.adickin
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

targets:
  PalmSlice:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    # Big plates (e.g. Fill Plate with a painted multi-part model) need more
    # memory than iOS gives an app by default.
    entitlements:
      path: PalmSlice/PalmSlice.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true

    # ── Source files ────────────────────────────────────────────
    sources:
      - path: PalmSlice
        excludes:
          - "**/.DS_Store"
          - "OrcaResources"
          - "OrcaResources/**"
      # OrcaSlicer vendor profiles + slicing data (scripts/15_orca_profiles.sh).
      # A folder reference keeps the profiles/<vendor> layout PresetBundle expects.
      - path: PalmSlice/OrcaResources
        type: folder
        buildPhase: resources

    # ── Linked frameworks ───────────────────────────────────────
    # libslic3r.xcframework is generated by script 11.
    # All other deps are linked via OTHER_LDFLAGS below.
    dependencies:
      - framework: libslic3r.xcframework
        embed: false    # static lib inside XCF — no embed needed
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: SceneKit.framework
      - sdk: ModelIO.framework   # libslic3r imports PLY / USD through ModelIO

    # ── Build settings ──────────────────────────────────────────
    settings:
      base:
        # Bridging header — Swift ↔ C bridge
        SWIFT_OBJC_BRIDGING_HEADER: PalmSlice/PalmSlice-Bridging-Header.h

        # C++ standard (must match how libslic3r was compiled)
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++

        # Per-SDK sysroot — resolved by Xcode at build time.
        # Simulator → ~/ios-sysroot-sim, Device → ~/ios-sysroot-dev
        "IOS_SYSROOT[sdk=iphonesimulator*]": "$(HOME)/ios-sysroot-sim"
        "IOS_SYSROOT[sdk=iphoneos*]": "$(HOME)/ios-sysroot-dev"

        # libslic3r's public defines (they change struct layouts, so they must
        # match scripts/14_orca_libslic3r.sh). BOOST_*_USE_PTHREADS match how
        # scripts/07_boost.sh built Boost; without them Boost.Log / Filesystem
        # objects are laid out differently from the prebuilt libraries.
        GCC_PREPROCESSOR_DEFINITIONS: >-
          $(inherited)
          SLIC3R_IOS
          BOOST_AC_USE_PTHREADS
          BOOST_SP_USE_PTHREADS
          USE_TBB
          TBB_USE_CAPTURED_EXCEPTION=0
          LIBNEST2D_GEOMETRIES_libslic3r
          LIBNEST2D_OPTIMIZER_nlopt
          LIBNEST2D_STATIC
          LIBNEST2D_THREADING_tbb

        # Search paths — use $(IOS_SYSROOT) so they resolve per SDK. OrcaSlicer's
        # headers come first: $(IOS_SYSROOT)/include may still hold an old
        # PrusaSlicer libslic3r/ that would otherwise shadow them.
        ORCA_PREFIX: "$(IOS_SYSROOT)/orca"
        HEADER_SEARCH_PATHS: >-
          $(inherited)
          $(ORCA_PREFIX)/include
          $(ORCA_PREFIX)/include/libslic3r
          $(ORCA_PREFIX)/include/orca_deps
          $(ORCA_PREFIX)/include/orca_deps/admesh
          $(ORCA_PREFIX)/include/orca_deps/clipper
          $(ORCA_PREFIX)/include/orca_deps/clipper2/Clipper2Lib/include
          $(ORCA_PREFIX)/include/orca_deps/glu-libtess/include
          $(ORCA_PREFIX)/include/orca_deps/libigl
          $(ORCA_PREFIX)/include/orca_deps/libnest2d/include
          $(ORCA_PREFIX)/include/orca_deps/miniz
          $(ORCA_PREFIX)/include/orca_deps/semver
          $(ORCA_PREFIX)/include/eigen3
          $(IOS_SYSROOT)/include

        LIBRARY_SEARCH_PATHS: >-
          $(inherited)
          $(ORCA_PREFIX)/lib
          $(IOS_SYSROOT)/lib

        # Link all static deps explicitly. OrcaSlicer's bundled deps (clipper,
        # admesh, ...) come from $(ORCA_PREFIX), never $(IOS_SYSROOT)/lib.
        OTHER_LDFLAGS: >-
          $(inherited)
          $(ORCA_PREFIX)/lib/libslic3r_cgal.a
          $(ORCA_PREFIX)/lib/libadmesh.a
          $(ORCA_PREFIX)/lib/libclipper.a
          $(ORCA_PREFIX)/lib/libClipper2.a
          $(ORCA_PREFIX)/lib/libglu-libtess.a
          $(ORCA_PREFIX)/lib/libmcut.a
          $(ORCA_PREFIX)/lib/libminiz_static.a
          $(ORCA_PREFIX)/lib/libqoi.a
          $(ORCA_PREFIX)/lib/libsemver.a
          $(ORCA_PREFIX)/lib/libnlopt.a
          $(ORCA_PREFIX)/lib/libdraco.a
          $(ORCA_PREFIX)/lib/libjpeg.a
          $(ORCA_PREFIX)/lib/liblibnoise_static.a
          $(IOS_SYSROOT)/lib/libqhullstatic_r.a
          $(IOS_SYSROOT)/lib/libqhullcpp.a
          $(IOS_SYSROOT)/lib/libmpfr.a
          $(IOS_SYSROOT)/lib/libgmpxx.a
          $(IOS_SYSROOT)/lib/libgmp.a
          $(IOS_SYSROOT)/lib/libboost_atomic.a
          $(IOS_SYSROOT)/lib/libboost_chrono.a
          $(IOS_SYSROOT)/lib/libboost_date_time.a
          $(IOS_SYSROOT)/lib/libboost_filesystem.a
          $(IOS_SYSROOT)/lib/libboost_iostreams.a
          $(IOS_SYSROOT)/lib/libboost_log.a
          $(IOS_SYSROOT)/lib/libboost_log_setup.a
          $(IOS_SYSROOT)/lib/libboost_nowide.a
          $(IOS_SYSROOT)/lib/libboost_program_options.a
          $(IOS_SYSROOT)/lib/libboost_regex.a
          $(IOS_SYSROOT)/lib/libboost_system.a
          $(IOS_SYSROOT)/lib/libboost_thread.a
          $(IOS_SYSROOT)/lib/libtbb.a
          $(IOS_SYSROOT)/lib/libtbbmalloc.a
          $(IOS_SYSROOT)/lib/libexpat.a
          $(IOS_SYSROOT)/lib/libpng.a
          $(IOS_SYSROOT)/lib/libz.a

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        # No bitcode (deprecated in Xcode 14+; required OFF for cross-compiled libs)
        ENABLE_BITCODE: NO

        # Required for mixed Swift + C++ projects
        SWIFT_VERSION: 5.9

        # Simulator runs on Apple Silicon as arm64
        ARCHS: arm64
        VALID_ARCHS: arm64

        # iPhone + iPad. Drives the actual device-family behavior; the
        # matching Info.plist key is intentionally omitted below since Xcode
        # overwrites/ignores it in favor of this build setting.
        TARGETED_DEVICE_FAMILY: "1,2"

        # Suppress warnings from libslic3r headers we don't own
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
        CLANG_WARN_EVERYTHING: NO

      debug:
        DEBUG_INFORMATION_FORMAT: dwarf
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"

      release:
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        SWIFT_OPTIMIZATION_LEVEL: "-O"

    # ── Info.plist ──────────────────────────────────────────────
    info:
      path: PalmSlice/Info.plist
      properties:
        CFBundleDisplayName: PalmSlice
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "7"
        # Long slices keep running in the background (SliceActivity, iOS 26+).
        BGTaskSchedulerPermittedIdentifiers:
          - com.adickin.PalmSlice.slice.*

        # Files app integration — shows app's Documents in the Files browser
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

        # Required device capabilities
        UIRequiredDeviceCapabilities:
          - arm64

        # Orientations
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # App targets both iPhone and iPad — actual device family comes from
        # the TARGETED_DEVICE_FAMILY build setting above, not this key.

        UILaunchStoryboardName: LaunchScreen

        # OctoPrint export talks to a printer on the local network. Plain-HTTP
        # access is allowed only for local hosts (IPs, .local, unqualified names).
        NSLocalNetworkUsageDescription: PalmSlice connects to your OctoPrint server on the local network to upload G-code.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

        # Only OS-provided encryption (URLSession HTTPS for OctoPrint) — exempt,
        # so this skips the export-compliance question on every submission.
        ITSAppUsesNonExemptEncryption: false

  PalmSliceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: PalmSliceTests

    dependencies:
      - target: PalmSlice

    settings:
      base:
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.adickin.PalmSliceTests
        TARGETED_DEVICE_FAMILY: "1,2"
